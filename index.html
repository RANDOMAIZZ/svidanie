<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Приглашение</title>
<meta name="description" content="Приглашение на свидание в Пятигорске" />
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="photo-bg"></div>
  <div class="photo-veil"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grain"></div>
  <div class="dots" id="dotsBg"></div>
</div>

<main class="stack" id="app">

  <section id="screen-1" class="screen active">
    <article class="postcard tilt" data-tilt>
      <header class="pc-head">
        <div class="pc-to">Приглашение</div>
        <div class="pc-stamp"><div class="stamp-inner">Пятигорск<br><b>2026</b></div></div>
      </header>
      <div class="pc-body">
        <div class="pc-media reveal d1">
          <img src="assets/hero.jpg" alt="Машук" />
        </div>
        <div class="pc-text">
          <h1 class="serif reveal d3">Пойдём на свидание?</h1>
          <div class="btn-zone reveal d6" id="btnZone">
            <button id="yesBtn" class="btn yes">Да</button>
            <button id="noBtn" class="btn no">Нет</button>
          </div>
        </div>
      </div>
    </article>
  </section>

  <section id="screen-2" class="screen">
    <article class="postcard tilt" data-tilt>
      <header class="pc-head">
        <div class="pc-to">Куда?</div>
        <div class="pc-num">02</div>
      </header>
      <div class="pc-media wide reveal d1"><img src="assets/walk.jpg" alt="Парк" /></div>
      <div class="grid" id="whereGrid">
        <button class="pick" data-value="Кафе">Кафе</button>
        <button class="pick" data-value="Кино">Кино</button>
        <button class="pick" data-value="Парк Цветник">Цветник</button>
        <button class="pick" data-value="Канатка на Машук">Машук</button>
        <button class="pick" data-value="Ресторан">Ресторан</button>
        <button class="pick" data-value="Прогулка к Провалу">Провал</button>
      </div>
      <input id="whereCustom" class="input" placeholder="Свой вариант…" />
      <div class="progress"><div class="bar" style="width:33%"></div></div>
      <div class="nav">
        <button class="btn ghost" onclick="goTo(1)">Назад</button>
        <button class="btn yes" onclick="goTo(3)">Дальше</button>
      </div>
    </article>
  </section>

  <section id="screen-3" class="screen">
    <article class="postcard tilt" data-tilt>
      <header class="pc-head">
        <div class="pc-to">Где?</div>
        <div class="pc-num">03</div>
      </header>
      <div class="preset-row">
        <button class="mini" data-lat="44.0319" data-lon="43.0818">Цветник</button>
        <button class="mini" data-lat="44.0447" data-lon="43.0880">Канатка</button>
        <button class="mini" data-lat="44.0415" data-lon="43.0937">Арфа</button>
        <button class="mini" data-lat="44.0395" data-lon="43.0999">Провал</button>
      </div>
      <div class="map-wrap"><div id="map"></div><div class="map-pulse"></div></div>
      <div class="map-info" id="mapInfo">Ткни в карту.</div>
      <div class="progress"><div class="bar" style="width:66%"></div></div>
      <div class="nav">
        <button class="btn ghost" onclick="goTo(2)">Назад</button>
        <button class="btn yes" onclick="goTo(4)">Дальше</button>
      </div>
    </article>
  </section>

  <section id="screen-4" class="screen">
    <article class="postcard tilt" data-tilt>
      <header class="pc-head">
        <div class="pc-to">Когда?</div>
        <div class="pc-num">04</div>
      </header>
      <div class="pc-media wide reveal d1"><img src="assets/evening.jpg" alt="Вечер" /></div>
      <label class="lbl">Дата</label>
      <input id="dateInput" type="date" class="input" />
      <label class="lbl">Время</label>
      <div class="time-row">
        <button class="mini t" data-t="Днём">День</button>
        <button class="mini t" data-t="Вечером">Вечер</button>
        <button class="mini t" data-t="На закате">Закат</button>
      </div>
      <input id="timeInput" type="time" class="input" value="18:00" />
      <label class="lbl">Заметка</label>
      <textarea id="msgInput" class="input" rows="2" placeholder="Пара слов…"></textarea>
      <button id="sendBtn" class="btn yes big" onclick="sendInvite()">Отправить</button>
      <div class="progress"><div class="bar" style="width:100%"></div></div>
      <div class="nav"><button class="btn ghost" onclick="goTo(3)">Назад</button></div>
    </article>
  </section>

  <section id="screen-5" class="screen">
    <article class="postcard tilt center" data-tilt>
      <header class="pc-head"><div class="pc-to">Готово</div><div class="pc-num">05</div></header>
      <h2 class="serif big">Принято.</h2>
      <p id="resultText" class="lead"></p>
      <a id="mapLink" href="#" target="_blank" class="btn ghost">Карта</a>
      <button class="btn yes" onclick="copyResult()">Копия</button>
      <a id="mailtoBtn" href="#" class="btn ghost">Дубль письмом</a>
      <p class="small" id="mailStatus"></p>
    </article>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
